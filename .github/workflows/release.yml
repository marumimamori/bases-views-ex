name: Release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run lint && npm test && npm run build && npm run verify-release
      - name: Publish BRAT assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')" = "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            dist/main.js dist/manifest.json dist/styles.css \
            dist/LICENSE dist/NOTICE dist/THIRD-PARTY-NOTICES
